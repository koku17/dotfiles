$dpms_enable = hyprctl eval 'hl.timer(function() hl.dispatch(hl.dsp.dpms({ action = "enable" })) end, {timeout = 100, type = "oneshot"})'
$dpms_disable = hyprctl eval 'hl.timer(function() hl.dispatch(hl.dsp.dpms({ action = "disable" })) end, {timeout = 100, type = "oneshot"})'

general {
	$temperature = hyprctl hyprsunset temperature "$(hyprctl hyprsunset temperature 2> /dev/null)"
	before_sleep_cmd = pidof hyprlock || hyprlock -q
	after_sleep_cmd = $dpms_enable ; brightnessctl -r ; $temperature 
	ignore_dbus_inhibit = false
	ignore_systemd_inhibit = false
}

listener {
	timeout = 60
	on-timeout = brightnessctl -s ; brightnessctl set 0%
	on-resume = brightnessctl -r
}

listener {
	timeout = 110
	on-timeout = brightnessctl set 0%
	on-resume = brightnessctl -r
}

listener {
	timeout = 115
	on-timeout = $dpms_disable ; pidof hyprlock || hyprlock -q
	on-resume = $dpms_enable ; brightnessctl -r
}

listener {
	timeout = 120
	on-timeout = systemctl suspend
}
